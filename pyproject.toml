[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "frameforge"
version = "0.6.0"
description = "Local Windows video downloader + AI upscaler (sequential queue, SQLite, ONNX)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "TheSeeker713" }]
dependencies = [
  "yt-dlp",
  "onnxruntime-directml",
  "customtkinter",
  "flet==0.86.5",
  "Pillow",
  "pystray",
  "psutil",
  "numpy",
  "opencv-python-headless",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-timeout>=2.3", "pyinstaller>=6"]

[project.scripts]
frameforge = "frameforge.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
timeout = 300
